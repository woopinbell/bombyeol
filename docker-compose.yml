# 로컬 개발·테스트용 Postgres. Supabase와 같은 메이저(17)로 고정한다(CLOUD_SESSION §2.1).
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bombyeol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bombyeol"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
